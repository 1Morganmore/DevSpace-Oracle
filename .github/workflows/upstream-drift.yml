name: upstream-drift
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Read-only upstream comparison
        run: python scripts/check_upstream.py --format json | tee upstream-drift.json
      - name: Summary
        if: always()
        run: cat upstream-drift.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upstream-drift
          path: upstream-drift.json
