name: release-portability
on: [push, pull_request, workflow_dispatch]
jobs:
  posix-process-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements-dev.txt
      - name: Enable and verify unprivileged PID namespaces
        shell: bash
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          unshare --user --map-root-user --pid --fork --kill-child=SIGKILL --mount-proc true
      - run: python -m pytest -q tests/test_verification_gates.py::test_fast_gate_posix_escalates_for_sigterm_resistant_descendant
      - run: python -m pytest -q tests/test_multi_gpt_runtime.py::test_child_slot_is_held_until_detached_descendant_is_observed_dead tests/test_multi_gpt_runtime.py::test_supervisor_cancel_timeout_overlap_reuses_one_termination_receipt
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_portability.py --root .
      - run: python scripts/check_skill_metadata.py --root .
      - run: python scripts/run_fast_gate.py --enforce-budget
      - run: python scripts/run_golden_path_smoke.py
      - run: python scripts/run_release_contract_tests.py --full
